version: '3.8'

services:
  finalproject:
    build: .
    container_name: finalproject-group5
    image: finalproject-group5:latest
    
    # GPU support
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    # Volumes for data persistence
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    
    # Working directory
    working_dir: /app
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Mount host network for API access
    networks:
      - ml_network

networks:
  ml_network:
    driver: bridge
